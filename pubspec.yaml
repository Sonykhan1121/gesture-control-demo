name: hand_gesture
description: "Offline portfolio demo with real on-device gesture recognition."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  permission_handler: ^11.4.0
  flutter_blue_plus: ^1.35.3
  camera: 0.10.5+9
  tflite_flutter: ^0.12.1
  image: ^4.3.0
  http: ^1.3.0
  dio: ^5.3.3
  path_provider: ^2.1.5
  lottie: ^2.5.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  video_player: ^2.11.1

dev_dependencies:
  camera_platform_interface: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/models/
    - assets/auth/
    - assets/devices/
    - assets/control/
    - assets/settings/
    - assets/social_practice/
    - assets/tutorials/
    - assets/gestures/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

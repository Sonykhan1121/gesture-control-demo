plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    namespace = "com.sonykhan.gesture_demo"
    compileSdk = 36
    ndkVersion = "28.2.13676358"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    defaultConfig {
        applicationId = "com.sonykhan.gesture_demo"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    aaptOptions { noCompress "tflite", "task" }
    // One authoritative model set for both native hosts.
    sourceSets.main.assets.srcDirs += ['../../models']
    buildTypes {
        release {
            // Local preview only. Configure your own release signing before publishing.
            signingConfig = signingConfigs.debug
        }
    }
}
flutter { source = "../.." }

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.32'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
